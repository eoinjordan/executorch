# Arducam Pico4ML-BLE (RP2040, Cortex-M0+, no FPU, 264 KB SRAM): HM01B0 over
# PIO + DMA, ST7735S over SPI1, console on USB CDC. The overlay next to this
# file carries the pins. A plain Raspberry Pi Pico builds the self-test with
# the camera and screen options off.
CONFIG_APP_CAMERA_HM01B0_PIO=y
CONFIG_PIO_RPI_PICO=y
CONFIG_DMA=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_APP_SCREEN_ST7735=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_SPI=y

# USB CDC ACM console; 1200 baud reboots into BOOTSEL for scripted reflashing
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="ExecuTorch MNIST"
CONFIG_APP_USB_BOOTSEL_ON_1200_BAUD=y
CONFIG_APP_BOOT_DELAY_MS=1500

# No FPU: fp32 in software, about 760 ms per inference. Keep RAM tight.
CONFIG_FPU=n
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=65536
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=8192
