# Arduino Nicla Vision (STM32H747 Cortex-M7): GC2145 on DCMI through the Zephyr
# video API (zephyr,camera is chosen in the board devicetree); console on USB
# CDC ACM by board default. Flash with west flash (dfu-util) after a double
# tap on the reset button.
CONFIG_APP_CAMERA_VIDEO=y
CONFIG_VIDEO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Two 160x120 RGB565 frames (the GC2145 driver scales down to that window)
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=81920
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32

CONFIG_FP_HARDABI=y
CONFIG_APP_BOOT_DELAY_MS=1500
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=131072
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=16384
