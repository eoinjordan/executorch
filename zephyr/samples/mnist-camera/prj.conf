# ExecuTorch runtime, selective operator build (only the ops in the .pte)
CONFIG_EXECUTORCH=y
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
CONFIG_EXECUTORCH_ENABLE_LOGGING=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y

# Hardware float where the core has it; the hard-float ABI is Arm-only and
# lives in boards/*.conf.
CONFIG_FPU=y
